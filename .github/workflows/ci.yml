name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Update dependencies
        run: |
          moon version --all
          moon update

      - name: Check formatting
        run: moon fmt --check

      - name: Check compilation
        run: moon check

      - name: Unit tests
        run: moon test

      - name: Integration tests
        run: moon cram test docs/fetch.md
