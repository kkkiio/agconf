name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build macOS arm64 release
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v6

      - name: Verify release version
        id: release
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' moon.mod)"
          if [[ "${GITHUB_REF_NAME}" != "v${version}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match moon.mod version ${version}" >&2
            exit 1
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "archive=agconf-${version}-darwin-arm64.tar.gz" >> "${GITHUB_OUTPUT}"

      - name: Set up MoonBit
        shell: bash
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "${HOME}/.moon/bin" >> "${GITHUB_PATH}"

      - name: Build and test release binary
        shell: bash
        run: |
          set -euo pipefail
          moon version --all
          moon update
          moon test
          moon build --target native --release
          mkdir -p dist/package
          cp _build/native/release/build/agconf.exe dist/package/agconf
          chmod +x dist/package/agconf
          file dist/package/agconf | grep -F "arm64"
          dist/package/agconf --help | grep -F "Usage: agconf"

      - name: Package release
        shell: bash
        env:
          ARCHIVE: ${{ steps.release.outputs.archive }}
        run: |
          set -euo pipefail
          tar -C dist/package -czf "dist/${ARCHIVE}" agconf
          sha256="$(shasum -a 256 "dist/${ARCHIVE}" | cut -d' ' -f1)"
          printf '%s  %s\n' "${sha256}" "${ARCHIVE}" > dist/SHA256SUMS

      - name: Upload release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ARCHIVE: ${{ steps.release.outputs.archive }}
        run: |
          set -euo pipefail
          gh release upload "${GITHUB_REF_NAME}" \
            "dist/${ARCHIVE}#macOS arm64 binary" \
            "dist/SHA256SUMS#SHA-256 checksums" \
            --repo "${GITHUB_REPOSITORY}" \
            --clobber

      - name: Publish to mooncakes
        shell: bash
        env:
          MOONCAKES_TOKEN: ${{ secrets.MOONCAKES_TOKEN }}
        run: |
          set -euo pipefail
          username="$(sed -n 's/^name = "\([^/]*\)\/.*"/\1/p' moon.mod)"
          mkdir -p "${HOME}/.moon"
          printf '{"token":"%s","username":"%s"}' \
            "${MOONCAKES_TOKEN}" "${username}" > "${HOME}/.moon/credentials.json"
          moon publish
