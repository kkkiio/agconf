name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build macOS arm64 release
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v6

      - name: Verify release version
        id: release
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' moon.mod)"
          if [[ "${GITHUB_REF_NAME}" != "v${version}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match moon.mod version ${version}" >&2
            exit 1
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "archive=agconf-${version}-darwin-arm64.tar.gz" >> "${GITHUB_OUTPUT}"

      - name: Set up MoonBit
        shell: bash
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s -- 0.10.6+80dc50f24
          echo "${HOME}/.moon/bin" >> "${GITHUB_PATH}"

      - name: Build and test release binary
        shell: bash
        run: |
          set -euo pipefail
          moon version --all
          moon update
          moon test
          moon build cmd/agconf --target native --release
          mkdir -p dist/package
          cp _build/native/release/build/cmd/agconf/agconf.exe dist/package/agconf
          chmod +x dist/package/agconf
          file dist/package/agconf | grep -F "arm64"
          dist/package/agconf --help | grep -F "Usage: agconf"

      - name: Package release
        id: package
        shell: bash
        env:
          ARCHIVE: ${{ steps.release.outputs.archive }}
        run: |
          set -euo pipefail
          tar -C dist/package -czf "dist/${ARCHIVE}" agconf
          sha256="$(shasum -a 256 "dist/${ARCHIVE}" | cut -d' ' -f1)"
          printf '%s  %s\n' "${sha256}" "${ARCHIVE}" > dist/SHA256SUMS
          echo "sha256=${sha256}" >> "${GITHUB_OUTPUT}"

      - name: Upload release payload
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ github.ref_name }}
          path: |
            dist/${{ steps.release.outputs.archive }}
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 14

    outputs:
      version: ${{ steps.release.outputs.version }}
      archive: ${{ steps.release.outputs.archive }}
      sha256: ${{ steps.package.outputs.sha256 }}

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download release payload
        uses: actions/download-artifact@v4
        with:
          name: release-${{ github.ref_name }}
          path: dist

      - name: Validate release payload
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum -c SHA256SUMS

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ARCHIVE: ${{ needs.build.outputs.archive }}
        run: |
          set -euo pipefail
          gh release create "${GITHUB_REF_NAME}" \
            "dist/${ARCHIVE}#macOS arm64 binary" \
            "dist/SHA256SUMS#SHA-256 checksums" \
            --generate-notes \
            --title "agconf ${GITHUB_REF_NAME}" \
            --verify-tag
